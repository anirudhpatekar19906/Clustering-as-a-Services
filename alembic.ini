# Alembic configuration for Clustering-as-a-Service.
# Database credentials are never stored here.
# The future migrations/env.py reads CAAS_DATABASE_URL via get_settings().

[alembic]
# Keep migration files under the project root, independent of the terminal's cwd.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s

# Readable revision filenames. Double %% is required by INI interpolation.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 50
output_encoding = utf-8

# sqlalchemy.url is deliberately omitted: migrations/env.py will use
# configuration.settings.get_settings().database_url.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
